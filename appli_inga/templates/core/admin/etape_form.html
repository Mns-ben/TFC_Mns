{% extends 'base/base.html' %}

{% block title %}{{ action }} une étape - Admin{% endblock %}

{% block content %}

<h2 class="section-title">{{ action }} une étape</h2>

<form method="post" class="table-wrap" style="padding:24px;">
    {% csrf_token %}
    
    {% for field in form %}
        <div style="margin-bottom:14px;">
            <label for="{{ field.id_for_label }}" style="display:block;font-weight:600;font-size:14px;margin-bottom:4px;">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <p style="color:#c0392b;font-size:12px;margin-top:4px;">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
    {% endfor %}
    
    <div style="display:flex;gap:10px;margin-top:16px;">
        <button type="submit" class="btn">Enregistrer</button>
        <a href="{% url 'admin_etapes' %}" class="btn btn-outline">Annuler</a>
    </div>
</form>

{% endblock %}
